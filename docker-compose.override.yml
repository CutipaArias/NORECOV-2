services:
  minio:
    image: norecov-minio-local:2025-10-15
    build:
      context: ./minio-lab
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NORECOV_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${NORECOV_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - norecov-internal
    restart: unless-stopped

volumes:
  minio-data:

